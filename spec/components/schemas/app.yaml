components:
  schemas:
    App:
      type: object
      description: holds metadata about the application event originates from.
      properties:
        bundleId:
          type: string
          description: >
            Bundle identifier (used by web apps bundled with Faro bundler plugins
            and mobile Android symbolication to encode build identity
            "{applicationId}@{versionCode}@{versionName}" (e.g. com.example.app@42@1.0.0)
            matching the symbols upload path and server-side R8/native retrace lookup key).
          x-go-type-skip-optional-pointer: true
        gitHash:
          type: string
          description: Git hash of the application source code this telemetry was generated from
          x-go-type-skip-optional-pointer: true
        environment:
          type: string
          description: Deployment environment (e.g. `production`, `staging`)
          x-go-type-skip-optional-pointer: true
        installationId:
          type: string
          description: >
            Per-installation identifier (OTel: app.installation.id).
            Identical across launches of the same installed app; usually resets on
            uninstall, but a restore from app backup can bring the old value back.
            Privacy-preserving alternative to device.id.
            On iOS, typically sourced from identifierForVendor, which stays the same
            after a reinstall while another app from the same vendor is installed.
          x-go-type-skip-optional-pointer: true
        name:
          type: string
          description: Application name
          x-go-type-skip-optional-pointer: true
        namespace:
          type: string
          description: Application namespace
          x-go-type-skip-optional-pointer: true
        release:
          type: string
          description: Release identifier
          x-go-type-skip-optional-pointer: true
        version:
          type: string
          description: Application version
          x-go-type-skip-optional-pointer: true
      x-go-type-skip-optional-pointer: true
